appId: com.nutricionespecializada.pos
productName: Nutricion Especializada
directories:
  output: release
  buildResources: resources

# El proceso principal y el preload. Las dependencias de produccion de
# desktop/ (electron-updater, embedded-postgres, pg) las agrega
# electron-builder automaticamente desde package.json.
files:
  - dist-electron/**
  - package.json

# Backend, frontend y migraciones viajan fuera del asar para que el backend
# pueda leerlos con rutas normales del sistema de archivos.
extraResources:
  # electron-builder omite el node_modules que esta en la raiz de un
  # extraResource. Por eso las dependencias del backend se copian aparte:
  # el origen es la propia carpeta node_modules, no un directorio que la
  # contenga.
  - from: backend-produccion
    to: backend
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: backend-produccion/node_modules
    to: backend/node_modules
    filter:
      - "**/*"
  - from: ../frontend/dist/frontend
    to: frontend/dist/frontend
    filter:
      - "**/*"
  - from: ../db/migrations
    to: db/migrations
    filter:
      - "**/*"
  # Cuenta inicial y credenciales SMTP. Se genera desde backend/.env con
  # scripts/preparar-configuracion.mjs y está ignorado por git.
  - from: configuracion.local.json
    to: configuracion.json

asar: false

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: "NutricionEspecializada-Setup-${version}.${ext}"
electronVersion: "39.8.10"
# publish deshabilitado: la app no usa auto-update
